<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Database Filing Hub</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header class="sidepanel-header">
    <div class="brand-wrap">
      <img src="monogram.png" alt="VS" class="brand-logo">
      <div>
        <div class="brand-title">VS Database</div>
        <div class="brand-subtitle">Office Filing Hub</div>
      </div>
    </div>
    <div class="header-status">
      <div id="server-status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="server-status-text">Connected</span>
      </div>
      <button id="btn-refresh-all" title="Refresh Clients & Status" class="btn-action-sm">🔄</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="sidepanel-content">
    
    <!-- Toast Feedback Message -->
    <div id="sidepanel-toast" class="toast-msg"></div>

    <!-- Filing Mode Toggle Bar -->
    <div class="mode-toggle-bar">
      <button type="button" id="mode-btn-single" class="mode-toggle-btn active">
        <span>⚡ Single Save</span>
      </button>
      <button type="button" id="mode-btn-bulk" class="mode-toggle-btn">
        <span>📦 Bulk Filing</span>
      </button>
    </div>

    <!-- Client Selection Card -->
    <section class="card">
      <div class="card-title">
        <span>1. Select Client</span>
        <span id="client-count-badge" style="font-size:10px;color:var(--text-light);font-weight:600;"></span>
      </div>

      <div class="field-group">
        <!-- Live Quick Search -->
        <div class="search-box-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="client-search" class="input-text input-search" placeholder="Type to filter clients..." autocomplete="off">
        </div>

        <!-- Client Dropdown -->
        <select id="client-select" class="select-input">
          <option value="">-- Choose Client --</option>
        </select>
      </div>

      <!-- Storage Destination Option -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11.5px;">
        <span style="font-weight:600;color:var(--text-muted);">Target Storage:</span>
        <select id="storage-kind-select" class="select-input" style="width:130px;padding:4px 8px;font-size:11.5px;">
          <option value="local" selected>💾 Local Drive</option>
          <option value="drive">☁️ Google Drive</option>
        </select>
      </div>
    </section>

    <!-- Destination Folder Navigation Card (Exact Website Module) -->
    <section class="card">
      <div class="card-title" style="flex-wrap:wrap;gap:4px;">
        <span>2. Destination Folder</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <span id="sidepanel-selected-badge" style="font-size:10.5px;font-weight:700;color:var(--primary);background:#eff6ff;border:1px solid #bfdbfe;padding:1px 6px;border-radius:4px;">
            / (Client Root)
          </span>
          <button type="button" id="btn-reset-folder" class="btn-action-sm" style="font-size:9.5px;display:none;color:#dc2626;">Reset</button>
        </div>
      </div>

      <div class="folder-browser-box">
        <div class="breadcrumb-bar" style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
          <div style="display:flex;align-items:center;gap:4px;overflow:hidden;flex:1;">
            <button type="button" id="btn-folder-up" class="btn-action-sm" style="font-size:10px;padding:2px 6px;" disabled>⬆ Up</button>
            <button type="button" id="btn-folder-root" class="btn-action-sm" style="font-size:10px;padding:2px 6px;">🏠</button>
            <span id="folder-breadcrumb-text" style="font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📁 / (Client Root)</span>
          </div>
          <button type="button" id="btn-use-current-folder" class="btn-action-sm" style="font-size:10px;background:var(--primary);color:#fff;font-weight:700;padding:2px 6px;white-space:nowrap;">✓ Use Folder</button>
        </div>

        <div id="folder-tree-container" class="folder-tree-list" style="max-height:160px;overflow-y:auto;">
          <div style="padding:10px;text-align:center;font-size:11.5px;color:var(--text-light);">Select a client to view folders</div>
        </div>
      </div>
    </section>

    <!-- Documents Queue Card -->
    <section class="card">
      <div class="card-title">
        <span>3. Documents to File</span>
        <span id="queue-count-badge" style="font-size:11px;font-weight:700;color:var(--primary);">0 files</span>
      </div>

      <!-- Live File List -->
      <div id="file-queue-container" class="file-queue-wrap">
        <!-- Empty Placeholder -->
        <div id="empty-queue-placeholder" style="text-align:center;padding:12px 6px;color:var(--text-light);font-size:12px;">
          ⚡ Downloads will automatically appear here
        </div>
      </div>

      <!-- Drag and drop zone -->
      <div id="dropzone" class="dropzone" style="margin-top:10px;">
        <input type="file" id="file-input-hidden" multiple style="display:none;">
        <div class="dropzone-text">📂 Click or drop files here to add</div>
      </div>
    </section>

    <!-- Action Section -->
    <section style="margin-top:auto;display:flex;flex-direction:column;gap:8px;">
      <!-- Practive Checkbox Option -->
      <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);cursor:pointer;padding:0 2px;">
        <input type="checkbox" id="check-practive-sync">
        <span>Upload to Practive automatically</span>
      </label>

      <!-- Save Button -->
      <button type="button" id="btn-save-all" class="btn-primary" disabled>
        💾 Save Document
      </button>
    </section>

  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
