<!DOCTYPE html>
<html lang="en">
<!--
 STUDIO UI REFERENCE (visual + behaviour spec)
 CONSOLE MOCK  = <aside class="side"> and <header class="top">, plus .blob background and body styles.
                 These only exist so the page looks complete. DO NOT PORT. The real app already has its own console and logo.
 STUDIO TAB    = <main id="studio-root"> and everything in <div id="studio-portal"> (dropdown panel, Page Organizer popup, toast).
                 PORT THESE ONLY.
 MOCK DATA     = placeholder page drawing (pg()), "load sample PDFs", fake page counts and file sizes. Replace with real PDF logic.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VS Database - Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe0f0;--bg2:#d9ceff;--bg3:#bfe8ff;--text:#2a1d55;--dim:#5f5391;--glass:rgba(255,255,255,.55);--row:rgba(255,255,255,.5);--edge:rgba(255,255,255,.95);--line:rgba(110,90,190,.25);--shadow:rgba(90,70,160,.2);--a1:#5b7cff;--a2:#9a5cff;--yes:#1fcf93;--no:#ff5d86;--tw:150px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden;font-size:14px}
button{font:inherit;color:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.7;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#ffb3e1;top:-80px;left:-60px}.b2{width:380px;height:380px;background:#8fdcff;bottom:-100px;right:-80px;animation-delay:-6s}.b3{width:260px;height:260px;background:#c3b0ff;top:45%;left:55%;opacity:.5;animation-delay:-11s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.15)}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--edge);box-shadow:0 12px 34px var(--shadow),inset 0 1px 0 #fff}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:228px minmax(0,1fr);gap:18px;padding:18px;min-height:100vh}
.side{border-radius:26px;padding:18px 12px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;letter-spacing:.02em}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 6px 16px rgba(110,100,255,.4)}
.logo svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--dim);font-weight:600;font-size:13px;text-decoration:none;cursor:default;transition:background .3s,color .3s}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:rgba(255,255,255,.5);color:var(--text)}
.nav a.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 8px 20px rgba(110,100,255,.4)}
.ver{margin-top:auto;padding:10px;font-size:11px;color:var(--dim);line-height:1.5}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.top{border-radius:22px;padding:14px 22px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--dim);font-size:13px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--row);border:1px solid var(--edge);font-size:12px;font-weight:600}
.pl i{width:8px;height:8px;border-radius:50%;background:#ffb020;box-shadow:0 0 8px #ffb020}
/* ===== STUDIO TAB STYLES (port, scope under #studio-root / #studio-portal) ===== */
#studio-root{display:flex;flex-direction:column;gap:16px;min-width:0}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:2px 4px 0}
.shead h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;margin:0;letter-spacing:-.01em}
.shead p{margin:4px 0 0;color:var(--dim);font-size:13px}
.tag{padding:7px 16px;border-radius:99px;border:1px solid rgba(91,124,255,.45);background:rgba(255,255,255,.55);color:#3d63e6;font-style:italic;font-size:12.5px;font-weight:600;white-space:nowrap;animation:tagin .7s cubic-bezier(.2,.9,.3,1.1)}
.tag sup{font-size:8px}@keyframes tagin{from{opacity:0;transform:translateX(14px)}}
.cbar{border-radius:22px;padding:16px 16px 14px;text-align:center}
.cats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:9px;border-radius:99px;padding:11px 20px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--dim);background:var(--row);border:1px solid var(--edge);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s,color .3s}
.cat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cat:hover{transform:translateY(-2px)}.cat:active{transform:scale(.96)}
.cat.on{color:#fff;background:linear-gradient(135deg,#4d66f2,#3a49dd);border-color:transparent;box-shadow:0 10px 26px rgba(61,80,224,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.cat .chev{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}.cat[aria-expanded=false] .chev{transform:rotate(180deg)}
.chint{margin:10px 0 0;font-size:12px;color:var(--dim)}
.cbar .banner{margin:12px auto 0;max-width:420px;justify-content:center}.cbar .banner.hide{margin:0 auto}
.tcollapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.3,.9,.3,1)}
.tcollapse>div{overflow:hidden;min-height:0}.tcollapse.closed{grid-template-rows:0fr}
.tools{padding:6px 2px 10px}
.banner{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:12px 16px;border-radius:16px;background:rgba(91,124,255,.12);border:1px solid rgba(91,124,255,.35);color:var(--text);font-weight:600;font-size:13px;transition:opacity .4s,max-height .4s,margin .4s,padding .4s;max-height:60px;overflow:hidden}
.banner.hide{opacity:0;max-height:0;margin:0;padding:0 16px;border-width:0}
.banner svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--a1);stroke-width:2.2;stroke-linecap:round}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px}
.tool{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--edge);background:var(--row);cursor:pointer;text-align:left;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s,opacity .3s;box-shadow:0 2px 10px rgba(90,70,160,.08)}
.tool:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 26px var(--shadow)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .ti{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(90,70,160,.25)}
.tool svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-size:13px}.tool small{display:block;color:var(--dim);font-size:11px;line-height:1.35;margin-top:2px}
.tool.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;box-shadow:0 12px 28px rgba(110,100,255,.45)}
.tool.on small{color:rgba(255,255,255,.85)}.tool.on .ti{background:rgba(255,255,255,.25)!important;box-shadow:none}
.work{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);gap:18px;align-items:start}
.left{display:flex;flex-direction:column;gap:18px}
.panel{border-radius:24px;padding:20px}
.panel h2{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;font-size:15px}
.panel h2 small{font-weight:600;color:var(--dim);font-size:11px}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:20px 12px;text-align:center;background:rgba(255,255,255,.3);transition:background .3s,border-color .3s,transform .3s}
.drop.over{background:rgba(91,124,255,.14);border-color:var(--a1);transform:scale(1.01)}
.drop b{display:block;font-size:14px}.drop span{display:block;color:var(--dim);font-size:12px;margin:3px 0 12px}
.drop em{display:block;font-style:normal;color:var(--dim);font-size:11px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:13px;color:#fff;cursor:pointer;white-space:nowrap;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 22px rgba(110,100,255,.42),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s,filter .3s,box-shadow .3s}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:hover:not(:disabled) svg.nudge{transform:translateX(4px)}.btn:active:not(:disabled){transform:scale(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.5);box-shadow:none}
.btn.ghost{background:var(--row);color:var(--text);border:1px solid var(--edge);box-shadow:0 2px 8px rgba(90,70,160,.1)}
.btn.red{background:linear-gradient(135deg,#ff8aa6,var(--no));box-shadow:0 8px 22px rgba(255,93,134,.4)}
.btn.wide{width:100%;padding:13px}
.link{background:none;border:0;color:var(--a1);font-weight:700;font-size:12px;cursor:pointer;padding:4px 0}
.fl{margin-top:16px}.fl h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:12px}
.fr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--row);border:1px solid var(--edge);margin-bottom:8px;cursor:pointer;transition:background .3s,border-color .3s,box-shadow .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.fr:hover{transform:translateX(3px)}
.fr.on{background:linear-gradient(135deg,rgba(91,124,255,.2),rgba(154,92,255,.16));border-color:var(--a1);box-shadow:0 0 22px rgba(91,124,255,.28)}
.pdf{flex:none;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6b7a,#d91f3d);padding:5px 7px;border-radius:8px}
.fi{flex:1;min-width:0}.fi b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi small{color:var(--dim);font-size:11px}
.ctl{display:flex;gap:2px}.ctl button{width:26px;height:26px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--dim);display:grid;place-items:center;transition:background .2s,color .2s}
.ctl button:hover{background:rgba(255,255,255,.7);color:var(--text)}.ctl button.x:hover{color:var(--no)}.ctl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.none{padding:14px;text-align:center;color:var(--dim);font-size:12px;line-height:1.5}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.fld small{display:block;color:var(--dim);font-size:11.5px;margin-top:5px;line-height:1.4}
.inp{width:100%;height:44px;padding:0 14px;border-radius:14px;background:var(--row);border:1px solid var(--edge);color:var(--text);font:inherit;font-size:13px;outline:none;transition:border-color .3s,box-shadow .3s}
.inp:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(91,124,255,.18)}.inp.bad{border-color:var(--no);box-shadow:0 0 0 3px rgba(255,93,134,.15)}
.err{color:#d6335c;font-size:12px;font-weight:600;margin:-6px 0 12px;min-height:0}
.ready{font-size:11px;font-weight:700;color:#0d9a68;background:rgba(31,207,147,.18);padding:3px 10px;border-radius:99px}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(91,124,255,.1);border:1px solid rgba(91,124,255,.3);margin-bottom:14px;font-weight:600;font-size:12.5px}
.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1;padding:11px 8px}
.ph{padding:26px 10px;text-align:center;color:var(--dim)}.ph b{display:block;color:var(--text);margin-bottom:4px}
/* checkbox (drawn tick) */
.cbx{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:12.5px;font-weight:600;line-height:1.4}
.box{position:relative;flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--row);border:1px solid var(--edge);box-shadow:0 2px 8px rgba(90,70,160,.12);transition:background .3s,box-shadow .3s,transform .3s cubic-bezier(.34,1.8,.5,1)}
.box svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.box path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s ease .12s}
[aria-checked=true]>.box,[aria-checked=true] .box{background:linear-gradient(135deg,#5af2bd,var(--yes));border-color:transparent;box-shadow:0 0 18px rgba(31,207,147,.55)}
[aria-checked=true]>.box path,[aria-checked=true] .box path{stroke-dashoffset:0}
.cbx:active .box{transform:scale(.88)}
/* glass select */
.sel{position:relative}
.gs-btn{width:100%;height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;background:var(--row);border:1px solid var(--edge);cursor:pointer;font-size:13px;color:var(--text);box-shadow:0 2px 8px rgba(90,70,160,.08);transition:border-color .3s,box-shadow .3s}
.gs-btn[aria-expanded=true]{border-color:var(--a1);box-shadow:0 0 0 3px rgba(91,124,255,.18)}
.gs-btn svg{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.gs-btn[aria-expanded=true] svg{transform:rotate(180deg)}
#gsp{position:fixed;z-index:300;padding:6px;border-radius:16px;max-height:280px;overflow:auto;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:opacity .14s,transform .14s;scrollbar-width:thin}
#gsp.show{opacity:1;pointer-events:auto;transform:none;transition:opacity .22s,transform .22s cubic-bezier(.2,.9,.3,1.1)}
.go{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--dim);font-size:13px;transition:background .2s,transform .2s,color .2s}
.go.act{background:rgba(91,124,255,.14);color:var(--text);transform:translateX(3px)}
.go.sl{background:linear-gradient(135deg,rgba(91,124,255,.22),rgba(154,92,255,.18));color:var(--text);font-weight:700}
.go svg{width:16px;height:16px;fill:none;stroke:var(--a1);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.go path{stroke-dasharray:1;stroke-dashoffset:1}.show .go.sl path{stroke-dashoffset:0;transition:stroke-dashoffset .35s ease .1s}
/* preview */
.prev{padding:18px;display:flex;flex-direction:column;height:min(78vh,760px);min-height:440px}
.ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph2 h2{margin:0;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.pc{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pc button{width:30px;height:30px;border-radius:10px;border:1px solid var(--edge);background:var(--row);cursor:pointer;display:grid;place-items:center;font-weight:700;transition:background .2s,transform .2s}
.pc button:hover:not(:disabled){background:#fff;transform:translateY(-1px)}.pc button:disabled{opacity:.4;cursor:default}
.pc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pc span{min-width:74px;text-align:center}
.scr{flex:1;overflow:auto;border-radius:18px;background:rgba(255,255,255,.35);border:1px solid var(--edge);padding:18px;scroll-behavior:smooth}
.pgs{width:calc(var(--z,1)*80%);margin:0 auto;display:flex;flex-direction:column;gap:18px;transition:width .3s}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim)}
.empty div{padding:30px;border-radius:22px;background:var(--row);border:1px solid var(--edge);max-width:300px}
.empty svg{width:42px;height:42px;fill:none;stroke:var(--a1);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}.empty b{display:block;color:var(--text);margin-bottom:4px}
/* placeholder page */
.pg{position:relative;width:100%;aspect-ratio:1/1.414;background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(90,70,160,.22);overflow:hidden;container-type:inline-size}
.pgi{position:absolute;inset:0;padding:9cqw 10cqw;transition:transform .4s;transform:rotate(var(--r,0deg))}
.pgi .hd{height:2.2cqw;width:38%;border-radius:2cqw;background:linear-gradient(90deg,var(--a1),var(--a2));margin-bottom:5cqw}
.pgi .tt{font-weight:700;font-size:6.2cqw;color:#2a1d55;margin-bottom:5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgi .ln{height:1.7cqw;border-radius:2cqw;background:#e6e1f5;margin-bottom:3.2cqw}
.pgi .big{position:absolute;left:0;right:0;bottom:22cqw;text-align:center;font-weight:700;font-size:15cqw;color:rgba(154,92,255,.16)}
.pn{position:absolute;bottom:4cqw;left:0;right:0;text-align:center;font-size:5cqw;font-weight:700;color:#5f5391}
/* modal */
#mbg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(60,40,120,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
#mbg.show{opacity:1;pointer-events:auto}
.modal{width:75vw;height:75vh;max-width:1600px;min-width:min(720px,100vw);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;transform:scale(.96) translateY(10px);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);background:rgba(255,255,255,.72)}
#mbg.show .modal{transform:none}
@media (max-width:800px){.modal{width:100vw;height:100vh;max-width:none;border-radius:0}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 10px}
.mh h2{margin:0;font-size:18px}.mh p{margin:3px 0 0;color:var(--dim);font-size:12px}
.xb{width:36px;height:36px;border-radius:12px;border:1px solid var(--edge);background:var(--row);cursor:pointer;display:grid;place-items:center}
.xb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 22px 12px}
.mt .btn{padding:8px 14px;font-size:12px;border-radius:12px}.mt .sp{flex:1}
.mt label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--dim)}.mt input[type=range]{width:110px;accent-color:var(--a2)}
.mb{flex:1;overflow:auto;padding:6px 22px 18px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw),1fr));gap:18px}
.th{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;border:1px solid transparent;cursor:pointer;transition:background .3s,border-color .3s,transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.th:hover{background:rgba(255,255,255,.6);transform:translateY(-3px)}
.th .box{position:absolute;top:16px;left:16px;z-index:3}
.th .pg{box-shadow:0 6px 18px rgba(90,70,160,.25)}
.th .ov{position:absolute;inset:10px 10px auto;aspect-ratio:1/1.414;border-radius:6px;display:grid;place-items:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.th .ov svg{width:36%;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transform:scale(.4);transition:transform .45s cubic-bezier(.34,1.8,.5,1)}
.th[aria-checked=true] .ov{opacity:1}.th[aria-checked=true] .ov svg{transform:none}
.m-delete .th[aria-checked=true]{border-color:rgba(255,93,134,.7);background:rgba(255,93,134,.12)}.m-delete .ov{background:rgba(255,93,134,.38)}

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TK='<svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CK='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ic=p=>`<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const NAV=[["Dashboard","M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"],["Clients","M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 7M22 21c0-3-2-5-4-5.6"],["Folder Structure","M3 6h7l2 2h9v11H3z"],["Save Files","M12 15V4M7 9l5-5 5 5M4 20h16"],["Studio","M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"],["VS AI","M9 4l1.6 4.4L15 10l-4.4 1.6L9 16l-1.6-4.4L3 10l4.4-1.6zM18 13l.9 2.1L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.9z"],["Drive Sharing","M7 18a4 4 0 01-.5-8A6 6 0 0118 8.5 4.5 4.5 0 0117.5 18z"],["Backup & Restore","M4 12a8 8 0 108-8M4 4v5h5"],["Activity","M3 12h4l3-8 4 16 3-8h4"],["Setup","M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"],["Users & Devices","M3 5h18v11H3zM8 20h8M12 16v4"]];
$("#nav").innerHTML=NAV.map(n=>`<a class="${n[0]==="Studio"?"on":""}">${ic(n[1])}${n[0]}</a>`).join("");
const TOOLS=[["merge","Merge PDF","Combine PDFs into one","M6 4v6a4 4 0 004 4h8M14 10l4 4-4 4","#7f98ff,#4c5fe0"],["split","Split PDF","Pages or page ranges","M12 4v16M5 8l-2 4 2 4M19 8l2 4-2 4","#ffa561,#f25f22"],["rotate","Rotate PDF","Rotate pages 90, 180, 270","M20 12a8 8 0 10-3 6.2M20 5v5h-5","#c08bff,#7a4be0"],["compress","Compress PDF","Reduce file size","M12 3v7M8 7l4 4 4-4M12 21v-7M8 17l4-4 4 4","#45e6a6,#0f9a57"],["unlock","Unlock PDF","Remove the password","M7 11V8a5 5 0 019-3M5 11h14v9H5z","#ff8aa6,#d91f3d"],["protect","Protect PDF","Secure with a password","M6 11h12v9H6zM8 11V8a4 4 0 018 0v3","#7f98ff,#3a55d9"],["extract","Extract Pages","Save pages as a new PDF","M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6","#8d9bff,#5560d8"],["delete","Delete Pages","Remove unwanted pages","M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13","#ff8aa6,#e0245a"],["reorder","Reorder Pages","Rearrange the sequence","M8 4v16M5 7l3-3 3 3M16 20V4M13 17l3 3 3-3","#ffc15f,#e8870a"],["watermark","Add Watermark","Text or image overlay","M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z","#5eead0,#17a98e"],["numbers","Page Numbers","Insert page numbers","M5 4h14v16H5zM10 9l2-2v7","#6fb4ff,#2756d9"],["images","Convert to Images","Export pages as JPG or PNG","M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01","#d79bff,#a24be0"]];
const CATS=[{id:"pdf",name:"PDF Tools",icon:"M6 3h8l4 4v14H6zM14 3v4h4",tools:TOOLS}];
let cat="pdf",catOpen=true;
function renderCats(){$("#cats").innerHTML=CATS.map(k=>`<button class="cat ${k.id===cat?"on":""}" role="tab" data-cat="${k.id}" aria-selected="${k.id===cat}" aria-expanded="${k.id===cat?catOpen:false}"><svg viewBox="0 0 24 24"><path d="${k.icon}"/></svg>${k.name} (${k.tools.length})<svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>`).join("");$("#tcol").classList.toggle("closed",!catOpen)}
const OUT={merge:"merge-pdf",split:"split-pdf",rotate:"rotate-pdf",compress:"compress-pdf",unlock:"unlock-pdf",protect:"protect-pdf",extract:"extract-pages",delete:"delete-pages",reorder:"rearrange-pages",watermark:"watermark",numbers:"page-numbers",images:"images"};
const ACT={merge:"Merge PDFs",split:"Split PDF",rotate:"Rotate pages",compress:"Compress PDF",unlock:"Unlock PDF",protect:"Protect PDF",extract:"Extract pages",delete:"Delete pages",reorder:"Apply order",watermark:"Add watermark",numbers:"Add page numbers",images:"Convert to images"};
const ORG={delete:"delete",extract:"extract",reorder:"reorder",images:"convert"};
/* state */
let docs=[],act=null,tool="split",uid=1,zoom=1,page=0;
const V={mode:"Extract page range",angle:"90° clockwise",which:"All pages",level:"Balanced",pos:"Center",fmt:"Page 1",npos:"Bottom center",em:"One combined PDF",cf:"JPG",dpi:"150 DPI"};
const SEL={delete:new Set(),extract:new Set(),convert:new Set()};
const TXT={rg:"",adv:"",seq:"",pw:"",wm:"CONFIDENTIAL",ns:"1",all:false};
const cur=()=>docs.find(d=>d.id===act);
const snap=d=>JSON.stringify({p:d.pages,n:d.numbered,s:d.num,k:d.kb});
const restore=(d,s)=>{const o=JSON.parse(s);d.pages=o.p;d.numbered=o.n;d.num=o.s;d.kb=o.k};
function addDoc(name,kb,n){const d={id:uid++,name,kb,numbered:false,num:1,hist:[],pages:Array.from({length:n},(_,i)=>({o:i+1,rot:0}))};d.orig=snap(d);docs.push(d);if(!act)act=d.id;return d}
const base=d=>d.name.replace(/\.pdf$/i,"");
const outName=d=>base(d)+"_"+OUT[tool]+(tool==="images"?".zip":".pdf");
const clearSel=()=>Object.values(SEL).forEach(s=>s.clear());
function parseRange(s,n){s=s.trim();if(!s)return{err:"Enter at least one page"};const out=new Set();for(const part of s.split(",")){const t=part.trim(),m=/^(\d+)(?:\s*-\s*(\d+))?$/.exec(t);if(!m)return{err:`"${t}" is not a valid page or range`};const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b<a)return{err:`"${t}" is not a valid range`};if(b>n)return{err:`Page ${b} does not exist. This file has ${n} page${n>1?"s":""}`};for(let i=a;i<=b;i++)out.add(i-1)}return{set:out}}
function rangeStr(set){const a=[...set].sort((x,y)=>x-y),r=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;r.push(j>i?`${a[i]+1}-${a[j]+1}`:`${a[i]+1}`);i=j+1}return r.join(", ")}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}
/* page placeholder */
const W=[92,78,96,64,86,54,80];
function pg(d,p,i){let l="";for(let k=0;k<7;k++)l+=`<div class="ln" style="width:${W[(k+p.o)%7]}%"></div>`;return `<div class="pg" style="--r:${p.rot}deg"><div class="pgi"><div class="hd"></div><div class="tt">${esc(base(d))}</div>${l}<div class="big">${p.o}</div></div>${d.numbered?`<div class="pn">${i+d.num}</div>`:""}</div>`}
/* glass select */
const gsp=$("#gsp");let gsEl=null,gsOpts=[],gsAct=0,gsType="";
function mkSel(el){const id=el.dataset.id,o=el.dataset.opts.split("|");el.innerHTML=`<button type="button" class="gs-btn" role="combobox" aria-haspopup="listbox" aria-expanded="false"><span>${esc(V[id])}</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;const b=$(".gs-btn",el);b.onclick=()=>gsEl===el?gsClose():gsOpen(el,id,o);b.onkeydown=e=>{if(["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){e.preventDefault();gsEl===el?0:gsOpen(el,id,o)}}}
function gsOpen(el,id,o){gsClose();gsEl=el;gsOpts=o;gsAct=Math.max(0,o.indexOf(V[id]));gsType=id;const b=$(".gs-btn",el);b.setAttribute("aria-expanded","true");
gsp.innerHTML=o.map((x,i)=>`<div class="go ${x===V[id]?"sl":""} ${i===gsAct?"act":""}" role="option" data-i="${i}">${esc(x)}${x===V[id]?TK:""}</div>`).join("");
const r=b.getBoundingClientRect();gsp.style.width=Math.max(r.width,180)+"px";gsp.style.left=Math.min(r.left,innerWidth-Math.max(r.width,180)-8)+"px";
const h=Math.min(280,o.length*40+12);gsp.style.top=(innerHeight-r.bottom<h+16&&r.top>h+16?r.top-h-8:r.bottom+8)+"px";requestAnimationFrame(()=>gsp.classList.add("show"))}
function gsClose(){if(!gsEl)return;$(".gs-btn",gsEl).setAttribute("aria-expanded","false");gsp.classList.remove("show");gsEl=null}
function gsPick(i){const id=gsType,el=gsEl,v=gsOpts[i];V[id]=v;$(".gs-btn span",el).textContent=v;gsClose();onSel(id)}
gsp.onclick=e=>{const g=e.target.closest(".go");if(g)gsPick(+g.dataset.i)};
gsp.onmousemove=e=>{const g=e.target.closest(".go");if(g){gsAct=+g.dataset.i;$$(".go",gsp).forEach((x,i)=>x.classList.toggle("act",i===gsAct))}};
document.addEventListener("mousedown",e=>{if(gsEl&&!gsp.contains(e.target)&&!gsEl.contains(e.target))gsClose()});
addEventListener("scroll",e=>{if(gsEl&&!gsp.contains(e.target))gsClose()},true);addEventListener("resize",gsClose);
document.addEventListener("keydown",e=>{if(gsEl){if(e.key==="Escape"){e.preventDefault();e.stopPropagation();const b=$(".gs-btn",gsEl);gsClose();b.focus();return}
if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();gsAct=(gsAct+(e.key==="ArrowDown"?1:-1)+gsOpts.length)%gsOpts.length;$$(".go",gsp).forEach((x,i)=>x.classList.toggle("act",i===gsAct))}
else if(e.key==="Enter"||e.key===" "){e.preventDefault();gsPick(gsAct)}
else if(e.key.length===1){const i=gsOpts.findIndex(x=>x.toLowerCase().startsWith(e.key.toLowerCase()));if(i>=0){gsAct=i;$$(".go",gsp).forEach((x,k)=>x.classList.toggle("act",k===i))}}return}
if(e.key==="Escape"&&M)closeOrg();if(e.key==="Tab"&&M){const f=$$("button:not(:disabled),[tabindex='0'],input",$("#modal"));if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}},true);
function onSel(id){if(M){renderFoot();return}if(id==="mode"||id==="fmt"||id==="npos"){renderSet()}}
/* render */
function renderTools(){const n=docs.length;$("#banner").classList.toggle("hide",n>0);$("#tools").innerHTML=CATS.find(k=>k.id===cat).tools.map(t=>{const dis=!n||(t[0]==="merge"&&n<2);return `<button class="tool ${tool===t[0]?"on":""}" data-t="${t[0]}" ${dis?"disabled":""}><span class="ti" style="background:linear-gradient(135deg,${t[4]})">${ic(t[3])}</span><span><b>${t[1]}</b><small>${t[0]==="merge"&&n===1?"Add one more PDF":t[2]}</small></span></button>`}).join("")}
function renderAdd(){const rows=docs.map((d,i)=>`<div class="fr ${d.id===act?"on":""}" data-id="${d.id}" tabindex="0" role="button" aria-label="Select ${esc(d.name)}"><span class="pdf">PDF</span><div class="fi"><b>${esc(d.name)}</b><small>${d.kb} KB · ${d.pages.length} page${d.pages.length>1?"s":""}</small></div><div class="ctl">${docs.length>1?`<button data-a="up" aria-label="Move up" ${i?"":"disabled"}><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button data-a="dn" aria-label="Move down" ${i<docs.length-1?"":"disabled"}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`:""}<button class="x" data-a="rm" aria-label="Remove">${CK}</button></div></div>`).join("");
$("#addp").innerHTML=`<h2>Add Files<small>Max 50 MB</small></h2><div class="drop" id="drop"><b>Choose PDF files</b><span>or drag and drop them here</span><button class="btn" id="choose">+ Choose files</button><input type="file" id="fin" accept=".pdf,application/pdf" multiple hidden><em>or <button class="link" id="samples">load sample PDFs</button></em></div><div class="fl"><h3>Selected files (${docs.length})${docs.length?`<button class="link" id="clr">Clear all</button>`:""}</h3>${rows||`<div class="none">No files yet.<br>Choose or drop PDF files above to begin.</div>`}</div>`}
function renderPrev(){const d=cur(),p=$("#prevp");if(!d){p.innerHTML=`<div class="ph2"><h2>Preview</h2></div><div class="scr"><div class="empty"><div><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h4"/></svg><b>No PDF selected</b>Choose or drop a PDF to preview it and unlock the tools.</div></div></div>`;return}
const n=d.pages.length;page=Math.min(page,n-1);p.innerHTML=`<div class="ph2"><h2>Preview · ${esc(d.name)}</h2><div class="pc"><button id="zo" aria-label="Zoom out">−</button><span id="zv">${Math.round(zoom*100)}%</span><button id="zi" aria-label="Zoom in">+</button><button id="pp" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="pn">Page ${page+1} of ${n}</span><button id="pnx" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div></div><div class="scr" id="scr"><div class="pgs" id="pgs" style="--z:${zoom}">${d.pages.map((q,i)=>`<div data-i="${i}">${pg(d,q,i)}</div>`).join("")}</div></div>`;navBtns()}
function navBtns(){const d=cur();if(!d)return;$("#pp").disabled=page<=0;$("#pnx").disabled=page>=d.pages.length-1;$("#pn").textContent=`Page ${page+1} of ${d.pages.length}`}
function field(id,l,o){return `<div class="fld"><label>${l}</label><div class="sel" data-id="${id}" data-opts="${o}"></div></div>`}
function tfield(id,l,ph,help,type){return `<div class="fld"><label for="${id}">${l}</label><input class="inp" id="${id}" type="${type||"text"}" value="${esc(TXT[id]||"")}" placeholder="${esc(ph||"")}">${help?`<small>${help}</small>`:""}</div>`}
function renderSet(){const d=cur(),p=$("#setp"),T=TOOLS.find(t=>t[0]===tool);if(!d){p.innerHTML=`<h2>${T[1]} settings</h2><div class="ph"><b>No PDF selected</b>Add a PDF to see the tool settings.</div>`;return}
const n=d.pages.length;let f=tfield("out","Output file name","",""),pick="";f=f.replace(`value="${esc("")}"`,`value="${esc(outName(d))}"`);
const mode=ORG[tool]?(tool==="images"?"convert":tool):null;
if(tool==="split"){f+=field("mode","Split mode","Extract page range|Every N pages|Single pages");if(V.mode==="Extract page range")f+=tfield("rg","Page range",`e.g. 1-${Math.min(3,n)}`,"Comma-separated pages and ranges.");if(V.mode==="Every N pages")f+=tfield("ns","Pages per file","2")}
if(tool==="rotate")f+=field("angle","Angle","90° clockwise|180°|90° counter-clockwise")+field("which","Pages","All pages|Odd pages|Even pages");
if(tool==="compress")f+=field("level","Compression level","Light|Balanced|Maximum");
if(tool==="unlock"||tool==="protect")f+=tfield("pw","Password","Enter password","","password");
if(tool==="watermark")f+=tfield("wm","Watermark text","")+field("pos","Position","Center|Diagonal|Footer");
if(tool==="numbers")f+=field("fmt","Format","1|Page 1|Page 1 of N")+field("npos","Position","Bottom center|Bottom right|Top right")+tfield("ns","Start number","1");
if(tool==="merge")f+=`<div class="fld"><small>Files are merged in the order shown in the list (${docs.length} files). Use the arrows to reorder them.</small></div>`;
if(mode){const c=mode==="reorder"?0:SEL[mode].size;f+=`<div class="pickrow"><span>${mode==="reorder"?"Drag pages into the order you want":c?c+" of "+n+" pages selected":"No pages selected yet"}</span><button class="btn" id="pickb">${ic("M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v6H4zM13 14h7v6h-7z")}Select pages</button></div>`;
f+=mode==="reorder"?tfield("seq","New page sequence (advanced)","e.g. 3, 1, 2","Type every page number once.") :tfield("adv","Pages (advanced)",`e.g. 1-${Math.min(3,n)}, ${n}`,"Stays in sync with the visual selection.")}
const all=docs.length>1?`<button class="cbx" role="checkbox" aria-checked="${TXT.all}" id="allc" style="margin:2px 0 12px"><span class="box">${TK}</span><span>Apply the same settings to all ${docs.length} loaded PDFs</span></button>`:"";
p.innerHTML=`<h2>${T[1]} settings<span class="ready">Ready</span></h2>${f}<div class="err" id="err"></div>${all}<button class="btn wide" id="go">${ACT[tool]}<svg class="nudge" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><div class="row2"><button class="btn ghost" id="undo">${ic("M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3")}Undo</button><button class="btn ghost" id="reset">${ic("M4 12a8 8 0 108-8M4 4v5h5")}Reset</button><button class="btn ghost" id="dl">${ic("M12 4v11M7 11l5 5 5-5M5 20h14")}Download</button></div><button class="btn ghost wide" id="save" style="margin-top:8px">${ic("M3 6h7l2 2h9v11H3z")}Save to client</button>`;
$$(".sel",p).forEach(mkSel);check()}
function check(){const d=cur();if(!d)return;const n=d.pages.length;let e="",ok=true;const mode=tool==="images"?"convert":tool;
if(tool==="split"&&V.mode==="Extract page range"){const r=parseRange(TXT.rg,n);if(r.err&&(TXT.rg||true))e=TXT.rg?r.err:"";if(r.err)ok=false;$("#rg")&&$("#rg").classList.toggle("bad",!!(TXT.rg&&r.err))}
if(["delete","extract","images"].includes(tool)){if(TXT.adv.trim()){const r=parseRange(TXT.adv,n);if(r.err){e=r.err;ok=false}}$("#adv")&&$("#adv").classList.toggle("bad",!!e);if(!e){const c=SEL[mode].size;if(!c)ok=false;if(tool==="delete"&&c>=n){ok=false;e=c?"You can't delete every page.":""}}}
if(tool==="reorder"){const s=TXT.seq.trim();if(s){const a=s.split(/[,\s]+/).filter(Boolean).map(Number);const okp=a.length===n&&new Set(a).size===n&&a.every(x=>x>=1&&x<=n);if(!okp){e=`Enter each page from 1 to ${n} exactly once.`;ok=false}}else ok=false;$("#seq")&&$("#seq").classList.toggle("bad",!!e)}
if(["unlock","protect"].includes(tool)&&!TXT.pw)ok=false;
if(tool==="numbers"&&!(+TXT.ns>=1))ok=false;
$("#err").textContent=e;$("#go").disabled=!ok;$("#undo").disabled=!d.hist.length;$("#reset").disabled=!d.hist.length}
function renderAll(){renderCats();renderTools();renderAdd();renderPrev();renderSet()}
/* operations */
function push(d){d.hist.push(snap(d))}
function run(){const d=cur();if(!d)return;const n=d.pages.length,t=tool,mode=t==="images"?"convert":t,tag=TXT.all&&docs.length>1?` (applied to ${docs.length} files)`:"";
if(t==="merge"){const m=addDoc("Merged.pdf",docs.reduce((a,x)=>a+x.kb,0),docs.reduce((a,x)=>a+x.pages.length,0));act=m.id;toast("Merged into Merged_merge-pdf.pdf");page=0}
else if(t==="split"){let c=1;if(V.mode==="Extract page range")c=1;else if(V.mode==="Single pages")c=n;else c=Math.ceil(n/Math.max(1,+TXT.ns||2));toast(`Split complete: ${c} file${c>1?"s":""} created`+tag)}
else if(t==="rotate"){push(d);const a=V.angle.startsWith("180")?180:V.angle.includes("counter")?-90:90;d.pages.forEach((p,i)=>{if(V.which==="All pages"||(V.which==="Odd pages"&&i%2===0)||(V.which==="Even pages"&&i%2===1))p.rot+=a});toast("Pages rotated"+tag)}
else if(t==="compress"){push(d);const f={Light:.8,Balanced:.6,Maximum:.4}[V.level];const o=d.kb;d.kb=Math.round(d.kb*f);toast(`Compressed ${o} KB → ${d.kb} KB`+tag)}
else if(t==="unlock"||t==="protect"){push(d);toast(t==="protect"?"Password protection added":"PDF unlocked");TXT.pw=""}
else if(t==="watermark"){push(d);toast(`Watermark "${TXT.wm}" added`+tag)}
else if(t==="numbers"){push(d);d.numbered=true;d.num=+TXT.ns||1;toast("Page numbers added. They follow any later reorder or delete.")}
else if(mode==="delete")doDelete(SEL.delete);
else if(mode==="extract")doExtract(SEL.extract,"One combined PDF");
else if(mode==="convert")doConvert(SEL.convert);
else if(t==="reorder"){push(d);const a=TXT.seq.split(/[,\s]+/).filter(Boolean).map(Number);d.pages=a.map(x=>d.pages[x-1]);TXT.seq="";toast("Pages reordered"+(d.numbered?" and renumbered":""))}
clearSel();TXT.adv="";renderAll()}
function doDelete(set){const d=cur(),c=set.size;push(d);d.pages=d.pages.filter((_,i)=>!set.has(i));clearSel();toast(`${c} page${c>1?"s":""} deleted${d.numbered?". Page numbers updated.":""}`)}
function doExtract(set,m){const d=cur(),ps=[...set].sort((a,b)=>a-b).map(i=>d.pages[i]);if(m==="One file per page"){ps.forEach(p=>{const x=addDoc(`${base(d)}_page-${p.o}.pdf`,Math.max(8,Math.round(d.kb/d.pages.length)),1);x.pages=[{...p}];x.orig=snap(x)});toast(`${ps.length} single-page files added to the list`)}else{const x=addDoc(`${base(d)}_extract-pages.pdf`,Math.max(8,Math.round(d.kb*ps.length/d.pages.length)),1);x.pages=ps.map(p=>({...p}));x.orig=snap(x);toast(`${ps.length} pages extracted into a new file`)}}
function doConvert(set){toast(`${set.size} page${set.size>1?"s":""} converted to ${V.cf} at ${V.dpi}. ZIP ready.`)}
/* events */
document.addEventListener("click",e=>{const ct=e.target.closest("[data-cat]");if(ct){if(ct.dataset.cat===cat)catOpen=!catOpen;else{cat=ct.dataset.cat;catOpen=true;tool=CATS.find(k=>k.id===cat).tools[0][0];renderTools();renderSet()}renderCats();return}const t=e.target.closest("[data-t]");if(t&&!t.disabled&&t.classList.contains("tool")){tool=t.dataset.t;renderTools();renderSet();return}
const fr=e.target.closest(".fr");if(fr){const b=e.target.closest("button[data-a]");const id=+fr.dataset.id,i=docs.findIndex(d=>d.id===id);if(b){const a=b.dataset.a;if(a==="rm"){docs.splice(i,1);if(act===id)act=docs[0]?docs[0].id:null;page=0;clearSel();if(tool==="merge"&&docs.length<2)tool="split"}else if(a==="up"&&i>0)[docs[i-1],docs[i]]=[docs[i],docs[i-1]];else if(a==="dn"&&i<docs.length-1)[docs[i+1],docs[i]]=[docs[i],docs[i+1]];renderAll();return}
if(act!==id){act=id;page=0;clearSel();TXT.rg=TXT.adv=TXT.seq="";renderAll()}return}
const id=e.target.closest("button,.cbx")?.id;
if(id==="choose")$("#fin").click();else if(id==="samples"){addDoc("Statement of Facts.pdf",662,3);addDoc("BHANWRIYA LIME UDHYOG.pdf",528,8);page=0;renderAll()}
else if(id==="clr"){docs=[];act=null;clearSel();tool="split";renderAll()}
else if(id==="go")run();else if(id==="pickb")openOrg(ORG[tool]);
else if(id==="undo"){const d=cur();if(d&&d.hist.length){restore(d,d.hist.pop());clearSel();renderAll()}}
else if(id==="reset"){const d=cur();if(d){restore(d,d.orig);d.hist=[];clearSel();renderAll();toast("Reset to the original file")}}
else if(id==="dl")toast("Download started (prototype)");else if(id==="save")toast("Saved to the client folder (prototype)");
else if(id==="allc"){TXT.all=!TXT.all;$("#allc").setAttribute("aria-checked",TXT.all)}
else if(id==="zo"||id==="zi"){zoom=Math.max(.6,Math.min(1.25,zoom+(id==="zi"?.15:-.15)));$("#pgs").style.setProperty("--z",zoom);$("#zv").textContent=Math.round(zoom*100)+"%"}
else if(id==="pp"||id==="pnx"){const d=cur();page=Math.max(0,Math.min(d.pages.length-1,page+(id==="pnx"?1:-1)));$(`#pgs [data-i="${page}"]`).scrollIntoView({block:"start"});navBtns()}});
document.addEventListener("input",e=>{const i=e.target.id;if(i in TXT&&i!=="all"){TXT[i]=e.target.value;if(i==="adv"){const d=cur(),mode=tool==="images"?"convert":tool,r=parseRange(e.target.value,d.pages.length);if(r.set){SEL[mode]=r.set;const pr=$(".pickrow span");if(pr)pr.textContent=`${r.set.size} of ${d.pages.length} pages selected`}}if(i==="out")return;check()}});
document.addEventListener("change",e=>{if(e.target.id==="fin"){addFiles(e.target.files);e.target.value=""}});
function addFiles(fs){[...fs].forEach(f=>{if(!/pdf$/i.test(f.name)&&f.type!=="application/pdf")return;addDoc(f.name,Math.max(1,Math.round(f.size/1024)),Math.max(3,Math.min(12,Math.round(f.size/90000))))});if(docs.length){page=0;renderAll();toast("Added (page previews are placeholders in this prototype)")}}
document.addEventListener("dragover",e=>{const z=e.target.closest("#drop");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest("#drop");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest("#drop");if(z){e.preventDefault();z.classList.remove("over");addFiles(e.dataTransfer.files)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("fr")&&e.target===document.activeElement){e.preventDefault();e.target.click()}});
document.addEventListener("scroll",e=>{if(e.target.id==="scr"){const d=cur(),s=e.target,y=s.scrollTop+s.clientHeight*.35;let k=0;$$("#pgs [data-i]").forEach(c=>{if(c.offsetTop-s.offsetTop<=y)k=+c.dataset.i});if(k!==page){page=k;navBtns()}}},true);
/* ---------- Page Organizer ---------- */
let M=null,opener=null;
const MODE={delete:["Delete pages","Tick the pages you want to remove."],extract:["Extract pages","Tick the pages to save as a new PDF."],reorder:["Reorder pages","Drag pages into the new order, or focus one and press Alt + arrow keys."],convert:["Convert to images","Tick the pages to export as images."]};
function openOrg(mode){const d=cur();if(!d)return;opener=document.activeElement;M={mode,d,work:d.pages.map(p=>({...p})),sel:new Set(mode==="reorder"?[]:SEL[mode]),last:null,busy:false,arm:false};
$("#modal").className="modal glass m-"+mode;$("#mtl").textContent=MODE[mode][0];$("#msub").textContent=`${d.name} · ${d.pages.length} pages. ${MODE[mode][1]}`;
$("#mtool").innerHTML=mode==="reorder"?`<button class="btn ghost" id="rst">Reset order</button><span class="sp"></span><label>Size<input type="range" id="szr" min="110" max="240" value="150"></label>`:`<button class="btn ghost" data-q="all">Select all</button><button class="btn ghost" data-q="none">Clear</button><button class="btn ghost" data-q="inv">Invert</button><button class="btn ghost" data-q="odd">Odd pages</button><button class="btn ghost" data-q="even">Even pages</button><span class="sp"></span><label>Size<input type="range" id="szr" min="110" max="240" value="150"></label>`;
$("#mbg").classList.add("show");renderGrid();renderFoot();setTimeout(()=>{const f=$(".th",$("#mgrid"))||$("#mx");f&&f.focus()},320)}
function closeOrg(){if(!M||M.busy&&0)return;$("#mbg").classList.remove("show");M=null;gsClose();opener&&opener.focus&&opener.focus()}
function renderGrid(keep){const d=M.d,g=$("#mgrid");g.innerHTML=M.work.map((p,i)=>`<div class="th" role="checkbox" aria-checked="${M.sel.has(i)}" tabindex="0" data-i="${i}" ${M.mode==="reorder"?'draggable="true"':""}><span class="box">${TK}</span>${pg(d,p,i)}<span class="ov">${M.mode==="delete"?CK:TK}</span><div class="cap">Page ${M.mode==="reorder"?i+1:p.o}${M.mode==="reorder"&&p.o!==i+1?`<i>was ${p.o}</i>`:""}</div></div>`).join("");if(keep!=null){const t=$(`.th[data-i="${keep}"]`,g);if(t){t.focus();t.classList.add("land")}}}
function renderFoot(){const f=$("#mfoot"),n=M.work.length,c=M.sel.size,m=M.mode;let h="";
if(m==="reorder"){const ch=M.work.some((p,i)=>p.o!==i+1);h=`<span class="cnt">${ch?"Order changed":"Original order"}${M.d.numbered?" · page numbers will follow":""}</span><button class="btn ghost" id="mc">Cancel</button><button class="btn" id="ma" ${ch?"":"disabled"}>Apply order</button>`}
else{h=`<span class="cnt">${c} of ${n} pages selected</span>`;
if(m==="extract")h+=`<div class="sel" data-id="em" data-opts="One combined PDF|One file per page"></div>`;
if(m==="convert")h+=`<div class="sel" data-id="cf" data-opts="JPG|PNG"></div><div class="sel" data-id="dpi" data-opts="72 DPI|150 DPI|300 DPI"></div><div class="prog" id="prog"><i></i></div>`;
const lab={delete:M.arm?`Click again to delete ${c}`:`Delete ${c||""} page${c===1?"":"s"}`,extract:`Extract ${c||""} page${c===1?"":"s"}`,convert:`Convert ${c||""} page${c===1?"":"s"}`}[m];
const dis=!c||(m==="delete"&&c>=n)||M.busy;h+=`<button class="btn ghost" id="mc">Cancel</button><button class="btn ${m==="delete"?"red":""}" id="ma" ${dis?"disabled":""}>${lab}</button>`}
f.innerHTML=h;$$(".sel",f).forEach(mkSel)}
function toggle(i,shift){if(shift&&M.last!=null){const [a,b]=[Math.min(M.last,i),Math.max(M.last,i)],on=!M.sel.has(i);for(let k=a;k<=b;k++)on?M.sel.add(k):M.sel.delete(k)}else{M.sel.has(i)?M.sel.delete(i):M.sel.add(i)}M.last=i;M.arm=false;$$(".th",$("#mgrid")).forEach((t,k)=>t.setAttribute("aria-checked",M.sel.has(k)));renderFoot()}
$("#mx").onclick=closeOrg;$("#mbg").addEventListener("mousedown",e=>{if(e.target.id==="mbg")closeOrg()});
$("#mtool").addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(q){const n=M.work.length,k=q.dataset.q;if(k==="all")M.sel=new Set(M.work.map((_,i)=>i));if(k==="none")M.sel=new Set();if(k==="inv")M.sel=new Set(M.work.map((_,i)=>i).filter(i=>!M.sel.has(i)));if(k==="odd")M.sel=new Set(M.work.map((_,i)=>i).filter(i=>i%2===0));if(k==="even")M.sel=new Set(M.work.map((_,i)=>i).filter(i=>i%2===1));M.arm=false;$$(".th",$("#mgrid")).forEach((t,i)=>t.setAttribute("aria-checked",M.sel.has(i)));renderFoot()}
if(e.target.id==="rst"){M.work=M.d.pages.map(p=>({...p}));renderGrid();renderFoot()}});
$("#mtool").addEventListener("input",e=>{if(e.target.id==="szr")document.documentElement.style.setProperty("--tw",e.target.value+"px")});
const grid=$("#mgrid");let dragI=null;
grid.addEventListener("click",e=>{const t=e.target.closest(".th");if(t&&M.mode!=="reorder")toggle(+t.dataset.i,e.shiftKey)});
function move(i,j){if(j<0||j>=M.work.length)return;const [x]=M.work.splice(i,1);M.work.splice(j,0,x);renderGrid(j);renderFoot()}
grid.addEventListener("keydown",e=>{const t=e.target.closest(".th");if(!t)return;const i=+t.dataset.i;
if(M.mode==="reorder"){if(e.altKey&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();move(i,i+(e.key==="ArrowRight"?1:-1))}}
else if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(i,e.shiftKey)}});
grid.addEventListener("dragstart",e=>{const t=e.target.closest(".th");if(!t||M.mode!=="reorder")return;dragI=+t.dataset.i;t.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragI)});
grid.addEventListener("dragend",()=>{dragI=null;$$(".th",grid).forEach(t=>t.classList.remove("drag","dl","dr"))});
grid.addEventListener("dragover",e=>{const t=e.target.closest(".th");if(!t||dragI==null)return;e.preventDefault();const r=t.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;$$(".th",grid).forEach(x=>x.classList.remove("dl","dr"));t.classList.add(left?"dl":"dr");t.dataset.side=left?"l":"r"});
grid.addEventListener("drop",e=>{const t=e.target.closest(".th");if(!t||dragI==null)return;e.preventDefault();let j=+t.dataset.i;if(t.dataset.side==="r")j++;if(dragI<j)j--;const from=dragI;dragI=null;if(from!==j)move(from,j);else renderGrid()});
$("#mfoot").addEventListener("click",e=>{const id=e.target.closest("button")?.id;if(id==="mc")closeOrg();
if(id==="ma"){const m=M.mode,d=M.d;
if(m==="reorder"){push(d);d.pages=M.work.map(p=>({...p}));const nb=d.numbered;closeOrg();clearSel();toast("Order applied"+(nb?". Page numbers were updated.":""));renderAll();return}
if(m==="delete"){if(!M.arm){M.arm=true;renderFoot();clearTimeout(M.t);M.t=setTimeout(()=>{if(M){M.arm=false;renderFoot()}},3000);return}SEL.delete=M.sel;doDelete(M.sel);closeOrg();renderAll();return}
if(m==="extract"){SEL.extract=M.sel;doExtract(M.sel,V.em);closeOrg();renderAll();return}
if(m==="convert"){SEL.convert=M.sel;M.busy=true;const pr=$("#prog");pr.classList.add("on");$("#ma").disabled=true;let v=0;const iv=setInterval(()=>{v+=8+Math.random()*10;$("i",pr).style.width=Math.min(100,v)+"%";if(v>=100){clearInterval(iv);setTimeout(()=>{doConvert(M.sel);M.busy=false;closeOrg();renderAll()},250)}},120)}}});
renderAll();
</script>
